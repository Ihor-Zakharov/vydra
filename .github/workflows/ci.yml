name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows (чистая), os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel, os: macos-13 }
    env:
      CI: "1"
      VYDRA_NO_LAUNCH: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Оболочки для тестов умных ссылок
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish

      # Установка ровно тем способом, что у пользователей, только из этой копии репозитория
      - name: Установщик (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          VYDRA_REPO: ${{ github.workspace }}
        run: |
          sh install.sh
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Установщик (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          VYDRA_REPO: ${{ github.workspace }}
        run: |
          .\install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (& uv tool dir --bin) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Обе команды работают
        shell: pwsh
        run: |
          vydra --version
          if ($LASTEXITCODE) { exit 1 }
          & ([regex]::Unescape('выдра')) --version
          if ($LASTEXITCODE) { exit 1 }
          vydra --help | Select-Object -First 5

      - name: Доктор (FFmpeg ставится сам, где его нет)
        run: vydra doctor --fix --offline

      - name: Конвертер работает на свежей установке
        shell: bash
        run: |
          FFMPEG="$(uv run --frozen python -c 'from vydra.config import Settings; print(Settings.from_env().ffmpeg)')"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i testsrc2=duration=2 -f lavfi -i sine=duration=2 -shortest smoke.mp4
          vydra convert smoke.mp4 -f both -y --out "$RUNNER_TEMP/lib"
          vydra конвертировать smoke.mp4 -ф мп3 -д --выход "$RUNNER_TEMP/lib"
          ls -R "$RUNNER_TEMP/lib"

      - name: Тесты
        run: uv run --frozen pytest -q

  live:
    name: Настоящие загрузки (может падать из-за проверки на бота)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: FFmpeg
        run: uv run --frozen vydra doctor --fix --offline || true
      - name: YouTube, TikTok, Instagram
        run: uv run --frozen pytest -m live -q
