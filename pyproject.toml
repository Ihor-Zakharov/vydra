[project]
name = "vydra"
version = "1.0.0"
description = "Локальное веб-приложение: скачивание видео с YouTube, TikTok, Instagram без водяных знаков с конвертацией в MP4/MP3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "yt-dlp[default,curl-cffi]",
    "platformdirs>=4.3",
    "send2trash>=1.8.3",
    "typer>=0.15",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
vydra = "vydra.cli:main"
"выдра" = "vydra.cli:main"
# набрано не в той раскладке: «выдра» латиницей и «vydra» кириллицей
dslhf = "vydra.cli:main"
"мнвкф" = "vydra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vydra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: реальные загрузки из интернета (запуск: pytest -m live)"]
addopts = "-m 'not live'"
